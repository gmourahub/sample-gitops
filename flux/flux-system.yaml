# Flux manages its own install: this Kustomization syncs flux/ (the controllers
# in flux-system/gotk-components.yaml, the GitRepository and every
# Kustomization). Upgrading Flux is a PR that regenerates gotk-components.yaml:
#   flux install --components=source-controller,kustomize-controller --export \
#     > flux/flux-system/gotk-components.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux
  prune: true
  sourceRef:
    kind: GitRepository
    name: sample-gitops
