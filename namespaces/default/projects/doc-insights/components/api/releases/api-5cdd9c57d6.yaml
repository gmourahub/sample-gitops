apiVersion: openchoreo.dev/v1alpha1
kind: ComponentRelease
metadata:
  name: api-5cdd9c57d6
  namespace: default
spec:
  componentProfile:
    traits:
    - instanceName: api-error-log-alert
      kind: ClusterTrait
      name: observability-alert-rule
      parameters:
        condition:
          interval: 1m
          operator: gt
          threshold: 2
          window: 1m
        description: api is logging errors (failed S3/SQS calls, 5xx responses)
        severity: critical
        source:
          query: error
          type: log
  componentType:
    kind: ClusterComponentType
    name: deployment/service
    spec:
      allowedTraits:
      - kind: ClusterTrait
        name: health-probes
      - kind: ClusterTrait
        name: horizontal-pod-autoscaler
      - kind: ClusterTrait
        name: observability-alert-rule
      - kind: ClusterTrait
        name: persistent-volume-claim
      - kind: ClusterTrait
        name: vertical-pod-autoscaler
      allowedWorkflows:
      - kind: ClusterWorkflow
        name: paketo-buildpacks-builder
      - kind: ClusterWorkflow
        name: gcp-buildpacks-builder
      - kind: ClusterWorkflow
        name: dockerfile-builder
      - kind: ClusterWorkflow
        name: ballerina-buildpack-builder
      environmentConfigs:
        openAPIV3Schema:
          $defs:
            ResourceQuantity:
              default: {}
              properties:
                cpu:
                  default: 100m
                  type: string
                memory:
                  default: 256Mi
                  type: string
              type: object
            ResourceRequirements:
              default: {}
              properties:
                limits:
                  $ref: '#/$defs/ResourceQuantity'
                requests:
                  $ref: '#/$defs/ResourceQuantity'
              type: object
          properties:
            imagePullPolicy:
              default: IfNotPresent
              enum:
              - Always
              - IfNotPresent
              - Never
              type: string
            replicas:
              default: 1
              minimum: 0
              type: integer
            resources:
              $ref: '#/$defs/ResourceRequirements'
          type: object
      resources:
      - id: deployment
        targetPlane: dataplane
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            labels: ${metadata.labels}
            name: ${metadata.name}
            namespace: ${metadata.namespace}
          spec:
            replicas: ${environmentConfigs.replicas}
            selector:
              matchLabels: ${metadata.podSelectors}
            template:
              metadata:
                labels: ${metadata.podSelectors}
              spec:
                containers:
                - args: |
                    ${has(workload.container.args) ? workload.container.args : oc_omit()}
                  command: |
                    ${has(workload.container.command) ? workload.container.command : oc_omit()}
                  env: ${dependencies.toContainerEnvs()}
                  envFrom: ${configurations.toContainerEnvFrom()}
                  image: ${workload.container.image}
                  imagePullPolicy: ${environmentConfigs.imagePullPolicy}
                  name: main
                  resources:
                    limits:
                      cpu: ${environmentConfigs.resources.limits.cpu}
                      memory: ${environmentConfigs.resources.limits.memory}
                    requests:
                      cpu: ${environmentConfigs.resources.requests.cpu}
                      memory: ${environmentConfigs.resources.requests.memory}
                  volumeMounts: ${configurations.toContainerVolumeMounts() + dependencies.toContainerVolumeMounts()}
                volumes: ${configurations.toVolumes() + dependencies.toVolumes()}
      - id: service
        includeWhen: ${size(workload.endpoints) > 0}
        targetPlane: dataplane
        template:
          apiVersion: v1
          kind: Service
          metadata:
            labels: ${metadata.labels}
            name: ${metadata.componentName}
            namespace: ${metadata.namespace}
          spec:
            ports: ${workload.toServicePorts()}
            selector: ${metadata.podSelectors}
            type: ClusterIP
      - forEach: ${workload.endpoints.transformMap(name, ep, "external" in ep.visibility
          && ep.type in ["HTTP", "GraphQL", "Websocket"], ep)}
        id: httproute-external
        targetPlane: dataplane
        template:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name":
              endpoint.key, "openchoreo.dev/endpoint-visibility": "external"})}'
            name: ${oc_generate_name(metadata.componentName, endpoint.key)}
            namespace: ${metadata.namespace}
          spec:
            hostnames: |
              ${[gateway.ingress.external.?http, gateway.ingress.external.?https]
                .filter(g, g.hasValue()).map(g, g.value().host).distinct()
                .map(h, metadata.environmentName + "-" + metadata.componentNamespace + "." + h)}
            parentRefs:
            - name: ${gateway.ingress.external.name}
              namespace: ${gateway.ingress.external.namespace}
            rules:
            - backendRefs:
              - name: ${metadata.componentName}
                port: ${endpoint.value.port}
              filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    replacePrefixMatch: ${endpoint.value.?basePath.orValue("/")}
                    type: ReplacePrefixMatch
              - cors:
                  allowCredentials: false
                  allowHeaders:
                  - '*'
                  allowMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                  - HEAD
                  allowOrigins:
                  - '*'
                  exposeHeaders:
                  - '*'
                type: CORS
              matches:
              - path:
                  type: PathPrefix
                  value: /${metadata.componentName}-${endpoint.key}
        var: endpoint
      - forEach: ${workload.endpoints.transformMap(name, ep, "internal" in ep.visibility
          && ep.type in ["HTTP", "GraphQL", "Websocket"], ep)}
        id: httproute-internal
        targetPlane: dataplane
        template:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name":
              endpoint.key, "openchoreo.dev/endpoint-visibility": "internal"})}'
            name: ${oc_generate_name(metadata.componentName, endpoint.key, "internal")}
            namespace: ${metadata.namespace}
          spec:
            hostnames: |
              ${[gateway.ingress.internal.?http, gateway.ingress.internal.?https]
                .filter(g, g.hasValue()).map(g, g.value().host).distinct()
                .map(h, metadata.environmentName + "-" + metadata.componentNamespace + "." + h)}
            parentRefs:
            - name: ${gateway.ingress.internal.name}
              namespace: ${gateway.ingress.internal.namespace}
            rules:
            - backendRefs:
              - name: ${metadata.componentName}
                port: ${endpoint.value.port}
              filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    replacePrefixMatch: ${endpoint.value.?basePath.orValue("/")}
                    type: ReplacePrefixMatch
              matches:
              - path:
                  type: PathPrefix
                  value: /${metadata.componentName}-${endpoint.key}
        var: endpoint
      - forEach: ${configurations.toConfigEnvsByContainer()}
        id: env-config
        targetPlane: dataplane
        template:
          apiVersion: v1
          data: |
            ${envConfig.envs.transformMapEntry(index, env, {env.name: env.value})}
          kind: ConfigMap
          metadata:
            name: ${envConfig.resourceName}
            namespace: ${metadata.namespace}
        var: envConfig
      - forEach: ${configurations.toConfigFileList()}
        id: file-config
        targetPlane: dataplane
        template:
          apiVersion: v1
          data:
            ${config.name}: |
              ${config.value}
          kind: ConfigMap
          metadata:
            name: ${config.resourceName}
            namespace: ${metadata.namespace}
        var: config
      - forEach: ${configurations.toSecretEnvsByContainer()}
        id: secret-env-external
        targetPlane: dataplane
        template:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: ${secretEnv.resourceName}
            namespace: ${metadata.namespace}
          spec:
            data: |
              ${secretEnv.envs.map(secret, {
                "secretKey": secret.name,
                "remoteRef": {
                  "key": secret.remoteRef.key,
                  ?"property": secret.remoteRef.?property
                }
              })}
            refreshInterval: 15s
            secretStoreRef:
              kind: ClusterSecretStore
              name: ${dataplane.secretStore}
            target:
              creationPolicy: Owner
              name: ${secretEnv.resourceName}
        var: secretEnv
      - forEach: ${configurations.toSecretFileList()}
        id: secret-file-external
        targetPlane: dataplane
        template:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: ${file.resourceName}
            namespace: ${metadata.namespace}
          spec:
            data:
            - remoteRef:
                key: ${file.remoteRef.key}
                property: |
                  ${has(file.remoteRef.property) ? file.remoteRef.property : oc_omit()}
              secretKey: ${file.name}
            refreshInterval: 15s
            secretStoreRef:
              kind: ClusterSecretStore
              name: ${dataplane.secretStore}
            target:
              creationPolicy: Owner
              name: ${file.resourceName}
        var: file
      validations:
      - message: Service components must have at least one endpoint. Use 'deployment/worker'
          for components without endpoints.
        rule: ${size(workload.endpoints) > 0}
      - message: Endpoints with 'external' visibility require gateway.ingress.external
          to be configured on the Environment or DataPlane.
        rule: |-
          ${workload.endpoints.exists(name, ep, "external" in ep.visibility)
            ? has(gateway.ingress) && has(gateway.ingress.external)
            : true}
      - message: Endpoints with 'internal' visibility require gateway.ingress.internal
          to be configured on the Environment or DataPlane.
        rule: |-
          ${workload.endpoints.exists(name, ep, "internal" in ep.visibility)
            ? has(gateway.ingress) && has(gateway.ingress.internal)
            : true}
      workloadType: deployment
  owner:
    componentName: api
    projectName: doc-insights
  traits:
  - kind: ClusterTrait
    name: observability-alert-rule
    spec:
      creates:
      - includeWhen: ${has(dataplane.observabilityPlaneRef)}
        targetPlane: observabilityplane
        template:
          apiVersion: openchoreo.dev/v1alpha1
          kind: ObservabilityAlertRule
          metadata:
            labels:
              openchoreo.dev/component-uid: ${metadata.componentUID}
              openchoreo.dev/environment-uid: ${metadata.environmentUID}
              openchoreo.dev/project-uid: ${metadata.projectUID}
            name: ${metadata.name}-${trait.instanceName}
            namespace: ${metadata.namespace}
          spec:
            actions:
              incident:
                enabled: ${has(environmentConfigs.actions) && has(environmentConfigs.actions.incident)
                  && (environmentConfigs.actions.incident.enabled || environmentConfigs.actions.incident.triggerAiRca
                  || environmentConfigs.actions.incident.triggerAiCostAnalysis)}
                triggerAiCostAnalysis: ${has(environmentConfigs.actions) && has(environmentConfigs.actions.incident)
                  && environmentConfigs.actions.incident.enabled && environmentConfigs.actions.incident.triggerAiCostAnalysis}
                triggerAiRca: ${has(environmentConfigs.actions) && has(environmentConfigs.actions.incident)
                  && environmentConfigs.actions.incident.enabled && environmentConfigs.actions.incident.triggerAiRca}
              notifications:
                channels: |-
                  ${(has(environmentConfigs.actions) && has(environmentConfigs.actions.notifications) && environmentConfigs.actions.notifications.channels.size() > 0)
                    ? environmentConfigs.actions.notifications.channels
                    : [environment.defaultNotificationChannel]}
            condition:
              interval: ${parameters.condition.interval}
              operator: ${parameters.condition.operator}
              threshold: ${parameters.condition.threshold}
              window: ${parameters.condition.window}
            description: ${parameters.description}
            enabled: ${environmentConfigs.enabled}
            name: ${trait.instanceName}
            severity: ${parameters.severity}
            source:
              metric: ${parameters.source.metric}
              query: ${parameters.source.query}
              type: ${parameters.source.type}
      environmentConfigs:
        openAPIV3Schema:
          properties:
            actions:
              properties:
                incident:
                  properties:
                    enabled:
                      default: false
                      description: Enables incident creation when this alert fires.
                        When enabled, a corresponding incident will be created in
                        the incident management system.
                      type: boolean
                    triggerAiCostAnalysis:
                      default: false
                      description: Enables AI-powered cost analysis when an incident
                        is created for a budget alert. Provides automated cost breakdown
                        and optimization recommendations. Requires incident.enabled
                        to also be true and is only valid for budget source type.
                      type: boolean
                    triggerAiRca:
                      default: false
                      description: Enables AI-powered root cause analysis when an
                        incident is created. When enabled, provides automated reports
                        of root causes for alert conditions. Requires incident.enabled
                        to also be true.
                      type: boolean
                  type: object
                notifications:
                  properties:
                    channels:
                      default: []
                      description: The notification channel identifiers where alerts
                        should be delivered. Configured per environment by platform
                        engineers. If not provided, defaults to the environment's
                        default notification channel.
                      items:
                        type: string
                      type: array
                  type: object
              type: object
            enabled:
              default: true
              description: Controls whether this alert rule is active. When disabled,
                the rule will not trigger alerts.
              type: boolean
          type: object
      parameters:
        openAPIV3Schema:
          properties:
            condition:
              properties:
                interval:
                  default: 1m
                  description: The frequency at which the alert rule is evaluated
                    (e.g. 1m, 5m, 15m, 30m).
                  type: string
                operator:
                  default: gt
                  description: 'The comparison operator used to evaluate the condition
                    against the threshold (gt: greater than, lt: less than, gte: greater
                    than or equal, lte: less than or equal, eq: equal).'
                  enum:
                  - gt
                  - lt
                  - gte
                  - lte
                  - eq
                  type: string
                threshold:
                  default: 10
                  description: The numeric threshold value used with the operator
                    to determine when the alert triggers.
                  type: integer
                window:
                  default: 5m
                  description: The time window over which data is aggregated before
                    evaluating the alert condition (e.g. 5m, 10m, 30m, 1h).
                  type: string
              type: object
            description:
              description: A human-readable description of what this alert rule monitors
                and when it triggers.
              type: string
            severity:
              default: warning
              description: The severity level of alerts triggered by this rule. Determines
                alert priority and notification urgency.
              enum:
              - info
              - warning
              - critical
              type: string
            source:
              properties:
                metric:
                  default: ""
                  description: 'The predefined metric to monitor for metric-based
                    alerts. Must be one of: cpu_usage, memory_usage. Required when
                    source type is ''metric''.'
                  type: string
                query:
                  default: ""
                  description: The query expression for log-based alerts. Required
                    when source type is 'log'.
                  type: string
                type:
                  description: The data source type for the alert rule.
                  enum:
                  - log
                  - metric
                  - budget
                  type: string
              required:
              - type
              type: object
          required:
          - description
          - source
          - condition
          type: object
      validations:
      - message: A notification channel is mandatory for alert rules (incident-only
          rules are not supported). Provide environmentConfigs.actions.notifications.channels
          or set environment.defaultNotificationChannel.
        rule: ${(has(environmentConfigs.actions) && has(environmentConfigs.actions.notifications)
          && environmentConfigs.actions.notifications.channels.size() > 0) || (has(environment.defaultNotificationChannel)
          && environment.defaultNotificationChannel != '')}
      - message: incident.enabled must be true when triggerAiRca is true. AI-powered
          root cause analysis requires incident creation to be enabled.
        rule: ${!has(environmentConfigs.actions) || !has(environmentConfigs.actions.incident)
          || environmentConfigs.actions.incident.triggerAiRca == false || environmentConfigs.actions.incident.enabled
          == true}
      - message: incident.enabled must be true when triggerAiCostAnalysis is true.
          AI-powered cost analysis requires incident creation to be enabled.
        rule: ${!has(environmentConfigs.actions) || !has(environmentConfigs.actions.incident)
          || environmentConfigs.actions.incident.triggerAiCostAnalysis == false ||
          environmentConfigs.actions.incident.enabled == true}
      - message: triggerAiCostAnalysis can only be enabled for budget source type
          alerts.
        rule: ${!has(environmentConfigs.actions) || !has(environmentConfigs.actions.incident)
          || environmentConfigs.actions.incident.triggerAiCostAnalysis == false ||
          parameters.source.type == 'budget'}
  workload:
    container:
      command:
      - node
      - api.js
      env:
      - key: PORT
        value: "8080"
      image: 000000000000.dkr.ecr.us-east-1.localhost:4566/doc-insights-backend:20261108-213045
    dependencies:
      resources:
      - envBindings:
          accessKeyId: AWS_ACCESS_KEY_ID
          bucket: S3_BUCKET
          endpoint: S3_ENDPOINT
          region: AWS_REGION
          secretAccessKey: AWS_SECRET_ACCESS_KEY
        ref: docs-bucket
      - envBindings:
          endpoint: SQS_ENDPOINT
          queueName: SQS_QUEUE_NAME
        ref: docs-queue
    endpoints:
      http:
        port: 8080
        type: HTTP
