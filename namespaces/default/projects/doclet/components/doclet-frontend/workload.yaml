apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: doclet-frontend-workload
  namespace: default
spec:
  container:
    image: 000000000000.dkr.ecr.us-east-1.localhost:4566/doclet-doclet-frontend-image:v1-0b8ae2b1
  dependencies:
    endpoints:
    - component: document-svc
      envBindings:
        address: DOC_SERVICE_URL
      name: http
      visibility: project
    - component: collab-svc
      envBindings:
        address: COLLAB_SERVICE_URL
      name: http
      visibility: project
  endpoints:
    http:
      port: 80
      type: HTTP
      visibility:
      - external
  owner:
    componentName: doclet-frontend
    projectName: doclet
